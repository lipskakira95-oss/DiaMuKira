name: iOS

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build-and-smoke:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - name: Select an iPhone simulator
        shell: bash
        run: |
          device_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for devices in data["devices"].values() for d in devices if d["name"].startswith("iPhone")))')"
          echo "IOS_DEVICE_ID=$device_id" >> "$GITHUB_ENV"
      - name: Analyze and test shared Flutter code
        working-directory: apps/quiz
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Build unsigned iPhone simulator app
        run: bash scripts/build-ios.sh debug
      - name: Run iPhone smoke test
        run: bash scripts/smoke-ios.sh "$IOS_DEVICE_ID"
      - name: Build unsigned iPhone archive
        run: |
          bash scripts/archive-ios.sh "" true
          test ! -d .local/release/diia-my-iphone.xcarchive/Products/Applications/Runner.app/_CodeSignature
      - name: Package simulator app
        if: success()
        run: |
          ditto -c -k --sequesterRsrc --keepParent apps/quiz/build/ios/iphonesimulator/Runner.app diia-my-iphone-simulator.zip
          ditto -c -k --sequesterRsrc --keepParent .local/release/diia-my-iphone.xcarchive diia-my-iphone-archive.zip
          shasum -a 256 diia-my-iphone-archive.zip > diia-my-iphone-archive.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: diia-my-iphone-simulator
          path: diia-my-iphone-simulator.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: diia-my-iphone-preview-archive
          path: |
            diia-my-iphone-archive.zip
            diia-my-iphone-archive.zip.sha256
            release/release.json
          if-no-files-found: error
          retention-days: 30
