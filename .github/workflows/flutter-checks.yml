name: Flutter client
on:
  push:
    branches:
      - '**'
  pull_request:
permissions:
  contents: read
jobs:
  client:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: false
      - name: Project-local Flutter SDK
        shell: powershell
        run: |
          git clone --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git .local/tools/flutter
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/flutter.ps1 --version
      - name: Project-local Pub dependencies
        shell: powershell
        working-directory: apps/quiz
        run: ../../scripts/flutter.ps1 pub get --enforce-lockfile
      - name: Verify Drift web binaries
        shell: powershell
        run: ./scripts/verify-drift-assets.ps1
      - name: Verify generated Drift code
        shell: powershell
        run: ./scripts/generate-drift.ps1 -Check
      - name: Verify generated SQLite snapshot
        shell: powershell
        run: |
          ./scripts/sync-content.ps1
          git diff --exit-code -- apps/quiz/assets/content/questions.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Formatting
        shell: powershell
        run: ./scripts/format-flutter.ps1 -Check
      - name: Analyze
        shell: powershell
        working-directory: apps/quiz
        run: ../../scripts/flutter.ps1 analyze --no-pub
      - name: Unit and widget tests
        shell: powershell
        run: ./scripts/test-flutter.ps1
      - name: Web build
        shell: powershell
        run: ./scripts/build-web.ps1
      - name: Build Go web host
        shell: powershell
        run: ./scripts/build.ps1
      - name: Chrome and Edge quality smoke
        shell: powershell
        run: ./scripts/smoke-web.ps1
      - name: Package and smoke offline web preview
        shell: powershell
        run: |
          ./scripts/package-web.ps1 -OfflineOnly
          $package = Get-ChildItem .local/release/diia-my-web-*.zip | Select-Object -First 1
          ./scripts/smoke-web-package.ps1 -Package $package.FullName
      - name: Upload web preview
        uses: actions/upload-artifact@v4
        with:
          name: diia-my-web-preview
          path: |
            .local/release/diia-my-web-*.zip
            .local/release/diia-my-web-*.zip.sha256
          if-no-files-found: error
          retention-days: 30
