name: Android

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - name: Install packages
        working-directory: apps/quiz
        run: flutter pub get
      - name: Analyze
        working-directory: apps/quiz
        run: flutter analyze --no-pub
      - name: Test
        working-directory: apps/quiz
        run: flutter test --no-pub
      - name: Build debug APK
        working-directory: apps/quiz
        run: flutter build apk --debug --no-pub
      - name: Build unsigned offline preview AAB
        working-directory: apps/quiz
        run: flutter build appbundle --release --dart-define=OFFLINE_ONLY=true
      - name: Verify and checksum preview AAB
        shell: bash
        run: |
          aab=apps/quiz/build/app/outputs/bundle/release/app-release.aab
          jarsigner -verify "$aab" 2>&1 | tee /tmp/aab-signature.txt
          grep -q "jar is unsigned" /tmp/aab-signature.txt
          sha256sum "$aab" > "$aab.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: diia-my-debug-apk
          path: apps/quiz/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: diia-my-android-preview-aab
          path: |
            apps/quiz/build/app/outputs/bundle/release/app-release.aab
            apps/quiz/build/app/outputs/bundle/release/app-release.aab.sha256
            release/release.json
          if-no-files-found: error
          retention-days: 30
